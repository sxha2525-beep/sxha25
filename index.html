  </svg>

  <button class="intro-overlay" id="introOverlay" type="button" aria-label="Preparando entrada" aria-disabled="true" aria-busy="true">

      <span class="intro-loader"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="intro-play"><svg class="icon"><use href="#i-play"/></svg></span>
    </span>
  </button>

  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="mark" href="#wine" aria-label="Volver al inicio">sxha25<span class="mark-dot">.</span></a>

      <div class="scene-backdrop" aria-hidden="true"></div>

          </div>
          <div class="friend-heading reveal" style="--delay:.2s"><span class="friend-heading-glyph" aria-hidden="true">✳</span><h2 id="cream-title" class="wip-title">Amigos<span class="period">.</span></h2><div class="friend-heading-rule" aria-hidden="true"></div></div>
        </div>
      </div>
    </section>

    <section class="scene scene-blue" id="blue" aria-labelledby="blue-title">
      <div class="scene-backdrop" aria-hidden="true"></div>
      <div class="scene-inner blue-layout">
        <div class="section-stamp"><span class="stamp-line"></span>03 / PIANO</div>
        <div class="archive-heading reveal" style="--delay:.08s">
          <div><h2 id="blue-title">Composiciones<span class="period">.</span></h2></div>
          <span class="archive-count" id="archiveCount">00 obras</span>

        <div class="archive-foot reveal" style="--delay:.33s"><span>Sxha25</span><span>03 / 03</span></div>
